name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-12-11

jobs:
  rust:
    name: Kernel crates (${{ matrix.name }})
    # FSEvents 实现是 macOS 专属，在 Linux 上由 cfg 排除；macOS 开发者本地仍可运行
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fmt
            command: cargo fmt --all -- --check
          - name: clippy
            command: cargo clippy --workspace --all-targets -- -D warnings
          - name: check
            command: cargo check --workspace --all-targets
          - name: test
            command: cargo test --workspace

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  linux-shell:
    name: Linux shell (Tauri v1)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: linux/src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri v1 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            adwaita-icon-theme \
            hicolor-icon-theme

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: linux/ui/package-lock.json

      - name: Build frontend bundle
        working-directory: linux/ui
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux/src-tauri

      - name: Format check
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --features custom-protocol

      - name: Real filesystem-event tests (inotify)
        run: cargo test --features custom-protocol -- --ignored

  bench:
    name: search-cache bench (large corpus)
    runs-on: ubuntu-22.04
    # push 到 main 或手动触发才跑；PR 仅在标题以 "perf:" 开头时跑
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'perf:'))
    defaults:
      run:
        working-directory: search-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: search-cache

      # Blobless shallow clone: downloads tree objects + commits only,
      # so every file path exists on disk but no file content is fetched.
      - name: Clone Linux kernel (blobless)
        run: |
          git clone \
            --depth=1 \
            --filter=blob:none \
            --no-tags \
            https://github.com/torvalds/linux \
            linux-corpus

      - name: Run benchmarks
        env:
          BENCH_CORPUS_DIR: ${{ github.workspace }}/search-cache/linux-corpus
        run: cargo bench --quiet --bench walk_and_search -- --output-format bencher | tee bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            search-cache/bench-output.txt
            search-cache/target/criterion/
